name: CI

on:
  pull_request:
    branches:
      - main
    paths:
      # Exclude docs
      # This comes first - last match wins
      # So to include things like package.json this
      # has to come first
      - "**"
      - "!**.md"
      - "tests/README.md"
      - "!**.json"
      - "!**.toml"
      - "!**.xml"
      - "!.gitignore"
      - "!.cwf**"

  push:
    branches: [main]
    paths:
      # Exclude docs
      # This comes first - last match wins
      # So to include things like package.json this
      # has to come first
      - "**"
      - "!**.md"
      - "tests/README.md"
      - "!**.json"
      - "!**.xml"
      - "!**.toml"
      - "!.gitignore"
      - "!.cwf**"

  workflow_dispatch:
    inputs:
      deploy_message:
        description: "Reason for manual build"
        type: string
        required: false
        default: "Manual trigger"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (${{ matrix.os }})
    # Avoid double dispatch and skip for closed events
    # If push and no PR or if PR and merge or open so we skip closed w/o merge
    if: |
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' && github.event.pull_request == null) ||
       (github.event.pull_request != null &&
         (github.event.pull_request.merged == true || github.event.pull_request.state == 'open')))
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install shells and linters (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo add-apt-repository -y ppa:fish-shell/release-4
          sudo apt-get update -q
          sudo apt-get install -y -q zsh fish shellcheck
          sudo apt-get install -y -q hyperfine || true

      - name: Install shells and linters (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install bash fish shellcheck
          brew install hyperfine || true

      - name: Install pinned ShellSpec
        run: |
          commit=$(awk '$1 == "commit" { print $2 }' tests/shellspec.pin)
          source=$(awk '$1 == "source" { print $2 }' tests/shellspec.pin)
          dir="$RUNNER_TEMP/shellspec"
          git init -q "$dir"
          git -C "$dir" fetch -q --depth 1 "$source" "$commit"
          git -C "$dir" checkout -q FETCH_HEAD
          echo "SHELLSPEC_BIN=$dir/shellspec" >> "$GITHUB_ENV"

      - name: Install pinned fishtape
        run: |
          commit=$(awk '$1 == "commit" { print $2 }' tests/fishtape.pin)
          source=$(awk '$1 == "source" { print $2 }' tests/fishtape.pin)
          dir="$RUNNER_TEMP/fishtape"
          git init -q "$dir"
          git -C "$dir" fetch -q --depth 1 "$source" "$commit"
          git -C "$dir" checkout -q FETCH_HEAD
          echo "FISHTAPE_FUNC=$dir/functions/fishtape.fish" >> "$GITHUB_ENV"

      - name: Build GNU Bash 4.4
        run: tests/support/build-bash 4.4 "$RUNNER_TEMP/bash-4.4/bash"

      - name: Build GNU Bash 5.3 (Linux)
        if: runner.os == 'Linux'
        run: |
          tests/support/build-bash 5.3 "$RUNNER_TEMP/bash-5.3/bash"
          echo "MARKSHARC_TEST_BASH=$RUNNER_TEMP/bash-5.3/bash" >> "$GITHUB_ENV"

      - name: Select Homebrew Bash 5.3 (macOS)
        if: runner.os == 'macOS'
        run: |
          bash_bin="$(brew --prefix bash)/bin/bash"
          # shellcheck disable=SC2016 # Check the selected shell's version.
          "$bash_bin" -c '[[ ${BASH_VERSINFO[0]}.${BASH_VERSINFO[1]} == 5.3 ]]'
          "$bash_bin" --version
          echo "MARKSHARC_TEST_BASH=$bash_bin" >> "$GITHUB_ENV"

      - name: Tool versions
        run: |
          zsh --version
          fish --version
          python3 --version
          shellcheck --version | sed -n 2p
          "$SHELLSPEC_BIN" --version

      - name: Lint
        run: tests/lint

      - name: zsh suite
        run: tests/run-tests --shell zsh spec/zsh

      - name: Contract suite (Bash 5.3)
        run: tests/run-tests --shell sh --format documentation spec/contract

      - name: Bash 4.4 contracts
        run: |
          MARKSHARC_TEST_BASH="$RUNNER_TEMP/bash-4.4/bash" tests/run-tests --shell sh \
            "$GITHUB_WORKSPACE"/tests/spec/contract/bash*_spec.sh spec/contract/launch_run_spec.sh

      - name: macOS Bash 3.2 environment-only contract
        if: runner.os == 'macOS'
        run: |
          /bin/bash -c '(( BASH_VERSINFO[0] == 3 && BASH_VERSINFO[1] == 2 ))'
          /bin/bash --version
          MARKSHARC_TEST_BASH=/bin/bash tests/run-tests --shell sh --fail-no-examples \
            --example 'keeps batch, no-TTY, agent, BASH_ENV and older Bash sessions env-only' \
            spec/contract/bash_interactive_spec.sh

      - name: Install suite
        run: tests/run-tests --shell sh spec/install

      - name: Repository suite
        run: tests/run-tests --shell sh spec/repo

      - name: Fish unit suite
        run: tests/run-fish-units

      - name: Advisory startup-time check
        continue-on-error: true
        run: tests/bench-startup --runs 5 --warmup 1

  # Exercise Day 0 startup and uninstall in fresh and preconfigured homes.
  install-e2e:
    name: install e2e (${{ matrix.os }})
    # Avoid double dispatch and skip for closed events
    # If push and no PR or if PR and merge or open so we skip closed w/o merge
    if: |
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' && github.event.pull_request == null) ||
       (github.event.pull_request != null &&
         (github.event.pull_request.merged == true || github.event.pull_request.state == 'open')))
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install zsh and Fish (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo add-apt-repository -y ppa:fish-shell/release-4
          sudo apt-get update -q
          sudo apt-get install -y -q zsh fish

      - name: Install Bash and Fish (macOS)
        if: runner.os == 'macOS'
        run: brew install bash fish

      - name: Tool versions
        run: |
          zsh --version
          fish --version
          git --version
          python3 --version

      - name: Build GNU Bash 5.3 (Linux)
        if: runner.os == 'Linux'
        run: |
          tests/support/build-bash 5.3 "$RUNNER_TEMP/bash-5.3/bash"
          echo "MARKSHARC_TEST_BASH=$RUNNER_TEMP/bash-5.3/bash" >> "$GITHUB_ENV"

      - name: Select Homebrew Bash 5.3 (macOS)
        if: runner.os == 'macOS'
        run: |
          bash_bin="$(brew --prefix bash)/bin/bash"
          # shellcheck disable=SC2016 # Check the selected shell's version.
          "$bash_bin" -c '[[ ${BASH_VERSINFO[0]}.${BASH_VERSINFO[1]} == 5.3 ]]'
          "$bash_bin" --version
          echo "MARKSHARC_TEST_BASH=$bash_bin" >> "$GITHUB_ENV"

      - name: Exercise install, shell startup and uninstall
        run: tests/e2e/install-e2e.sh "$GITHUB_WORKSPACE"

      - name: Install Bash PTY tools
        run: |
          brew_bin=brew
          if [ "$RUNNER_OS" = Linux ]; then
            brew_bin=/home/linuxbrew/.linuxbrew/bin/brew
          fi
          "$brew_bin" install starship atuin zoxide fzf carapace bash-completion@2 gawk make tmux
          prefix=$("$brew_bin" --prefix)
          test -r "$("$brew_bin" --prefix bash-completion@2)/share/bash-completion/bash_completion"
          printf '%s\n' "$prefix/bin" >> "$GITHUB_PATH"
          printf 'HOMEBREW_PREFIX=%s\n' "$prefix" >> "$GITHUB_ENV"

      - name: Exercise the full Bash profile in a PTY
        run: python3 tests/e2e/bash-live.py
