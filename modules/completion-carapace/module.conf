describe "Carapace completion for zsh (opt-in; disables fzf-tab unless forced)"
order 72
requires command carapace
option enable off "Activate Carapace completion in interactive zsh shells"
option bridges "zsh,fish,bash" "Bridged completion engines for CARAPACE_BRIDGES (comma or space separated; empty or off disables)"
option excludes "" "Commands excluded from Carapace via CARAPACE_EXCLUDES (comma or space separated)"
option allow_fzf_tab off "Keep completion-fzf-tab active alongside Carapace (not recommended; known upstream conflicts)"
package brew carapace
