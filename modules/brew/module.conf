describe "Homebrew: PATH directories (env) and cached shellenv (init)"
order 10
option linuxbrew_tier local "PATH tier for Linuxbrew (local keeps the old order; brew puts it ahead of the system tier)"
path brew /opt/homebrew/bin
path brew /opt/homebrew/sbin
path ${_ms_opt_brew_linuxbrew_tier} /home/linuxbrew/.linuxbrew/bin
path ${_ms_opt_brew_linuxbrew_tier} /home/linuxbrew/.linuxbrew/sbin
update brew-update brew update
update brew-upgrade brew upgrade
