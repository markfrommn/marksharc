describe "mise: opt-in node, Go, Python and Ruby ownership"
order 29
option tools "" "Space-separated tools owned by mise: node, go, python and ruby"
option version_files on "Enable idiomatic version files for owned tools"
option compat on "Translate common nvm and gvm commands to mise"
option auto_install off "Install a missing tool automatically when a command is not found"
option set_gobin off "Let mise set GOBIN inside each Go installation"
option hook chpwd "Interactive activation hook: chpwd, prompt or off"
package brew mise
update mise-tools mise upgrade
installer mise installers/mise
