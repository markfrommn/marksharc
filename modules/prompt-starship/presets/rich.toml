"$schema" = 'https://starship.rs/config-schema.json'

add_newline = true
format = """
[](color_orange)\
$os\
$username\
[](bg:color_yellow fg:color_orange)\
$directory\
[](fg:color_yellow bg:color_aqua)\
$git_branch\
$git_status\
[](fg:color_aqua bg:color_blue)\
$c\
$cpp\
$rust\
$golang\
$nodejs\
$bun\
$php\
$java\
$kotlin\
$haskell\
$python\
[](fg:color_blue bg:color_bg3)\
$docker_context\
$conda\
$pixi\
[](fg:color_bg3 bg:color_bg1)\
$time\
[ ](fg:color_bg1)\
$shell\
$fill\
$cmd_status\
$jobs\
$shlvl\
$sudo\
$line_break$character"""
palette = 'gruvbox_dark'
#${custom.shell}\

[bun]
format = '[[ $symbol( $version) ](fg:color_fg0 bg:color_blue)]($style)'
style = "bg:color_blue"
symbol = ""

[c]
format = '[[ $symbol( $version) ](fg:color_fg0 bg:color_blue)]($style)'
style = "bg:color_blue"
symbol = " "

[character]
disabled = false
error_symbol = '[](bold fg:color_red)'
success_symbol = '[](bold fg:color_green)'
vimcmd_replace_one_symbol = '[](bold fg:color_purple)'
vimcmd_replace_symbol = '[](bold fg:color_purple)'
vimcmd_symbol = '[](bold fg:color_green)'
vimcmd_visual_symbol = '[](bold fg:color_yellow)'

# Only commands that ran for two seconds or more.
[cmd_duration]
min_time = 2000
format = '[⏱ $duration](yellow) '

[conda]
format = '[[ $symbol( $environment) ](fg:#83a598 bg:color_bg3)]($style)'
style = "bg:color_bg3"

[cpp]
format = '[[ $symbol( $version) ](fg:color_fg0 bg:color_blue)]($style)'
style = "bg:color_blue"
symbol = " "

#[env_var.STARSHIP_SHELL]
#format = "[$env_value]($style) "
#style = "bold dimmed white"

[custom.shell]
when = "true"
format = "$output "
command = '''
case "$STARSHIP_SHELL" in
  bash)
    printf " bash"
    ;;
  fish)
    printf " fish"
    ;;
  zsh)
    printf "🅉 zsh"
    ;;
  *)
    printf " ${STARSHIP_SHELL}"
    ;;
esac
'''
style = "bold green"
#style = "bold yellow"
#style = "bold cyan"

[directory]
format = "[ $path ]($style)"
style = "fg:color_fg0 bg:color_yellow"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Developer" = "󰲋 "
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "

[docker_context]
format = '[[ $symbol( $context) ](fg:#83a598 bg:color_bg3)]($style)'
style = "bg:color_bg3"
symbol = ""

[fill]
#symbol = ' '
symbol = '┅'

[jobs]
symbol = '✦ '

[git_branch]
format = '[[ $symbol $branch ](fg:color_fg0 bg:color_aqua)]($style)'
style = "bg:color_aqua"
symbol = ""

[git_status]
format = '[[($all_status$ahead_behind )](fg:color_fg0 bg:color_aqua)]($style)'
style = "bg:color_aqua"

[golang]
format = '[[ $symbol( $version) ](fg:color_fg0 bg:color_blue)]($style)'
style = "bg:color_blue"
symbol = ""

[haskell]
format = '[[ $symbol( $version) ](fg:color_fg0 bg:color_blue)]($style)'
style = "bg:color_blue"
symbol = ""

[java]
format = '[[ $symbol( $version) ](fg:color_fg0 bg:color_blue)]($style)'
style = "bg:color_blue"
symbol = ""

[kotlin]
format = '[[ $symbol( $version) ](fg:color_fg0 bg:color_blue)]($style)'
style = "bg:color_blue"
symbol = ""

[line_break]
disabled = false

[nodejs]
format = '[[ $symbol( $version) ](fg:color_fg0 bg:color_blue)]($style)'
style = "bg:color_blue"
symbol = ""

[os]
disabled = false
style = "bg:color_orange fg:color_fg0"

[os.symbols]
AOSC = ""
Alpine = ""
Amazon = ""
Android = ""
Arch = "󰣇"
Artix = "󰣇"
CentOS = ""
Debian = "󰣚"
EndeavourOS = ""
Fedora = "󰣛"
Gentoo = "󰣨"
Linux = "󰌽"
Macos = "󰀵"
Manjaro = ""
Mint = "󰣭"
Pop = ""
Raspbian = "󰐿"
RedHatEnterprise = "󱄛"
Redhat = "󱄛"
SUSE = ""
Ubuntu = "󰕈"
Windows = "󰍲"

[palettes.gruvbox_dark]
color_aqua = '#689d6a'
color_bg1 = '#3c3836'
color_bg3 = '#665c54'
color_blue = '#458588'
color_fg0 = '#fbf1c7'
color_green = '#98971a'
color_orange = '#d65d0e'
color_purple = '#b16286'
color_red = '#cc241d'
color_yellow = '#d79921'

[php]
format = '[[ $symbol( $version) ](fg:color_fg0 bg:color_blue)]($style)'
style = "bg:color_blue"
symbol = ""

[pixi]
format = '[[ $symbol( $version)( $environment) ](fg:color_fg0 bg:color_bg3)]($style)'
style = "bg:color_bg3"

[python]
format = '[[ $symbol( $version) ](fg:color_fg0 bg:color_blue)]($style)'
style = "bg:color_blue"
symbol = ""

[rust]
format = '[[ $symbol( $version) ](fg:color_fg0 bg:color_blue)]($style)'
style = "bg:color_blue"
symbol = ""

[shell]
disabled = false
format = '[$indicator]($style) '
style = 'green bold'
#bash_indicator=" bash"
bash_indicator=""
#fish_indicator=" fish"
fish_indicator=""
zsh_indicator="🅉"
#zsh_indicator="🅉"
powershell_indicator="🄿"
nu_indicator="🄽"
unknown_indicator=" ${STARSHIP_SHELL}"

# The nesting depth, once inside a nested shell.
[shlvl]
disabled = false
threshold = 2
format = '[↕$shlvl]($style) '

# The exit code of a failed command; the red prompt character says that it failed.
[status]
disabled = false
format = '[✘ $status]($style) '

# Shown while sudo credentials are cached.
[sudo]
disabled = false
format = '[$symbol]($style)'
symbol = '⚡ '

[time]
disabled = false
format = '[[  $time ](fg:color_fg0 bg:color_bg1)]($style)'
style = "bg:color_bg1"
time_format = "%R"

[username]
format = '[ $user ]($style)'
show_always = true
style_root = "bg:color_orange fg:color_fg0"
style_user = "bg:color_orange fg:color_fg0"
