describe "Open a local or remote directory or repository in a multiplexer"
order 60
option prefer "hc herdr tmux" "Multiplexer preference order outside a running multiplexer"
option place workspace "Default placement: workspace, tab, or hidden"
option focus on "Focus the new terminal when the multiplexer supports it"
option repo_cache_minutes 60 "Repository inventory cache lifetime in minutes"
option ssh_timeout 10 "Remote inventory SSH connect timeout in seconds"
