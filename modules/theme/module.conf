describe "Colour baseline: vivid LS_COLORS, bat man pager, opt-in delta for git, fzf defaults and previews"
order 21
option ls_colors molokai "vivid theme for LS_COLORS (vivid themes lists them); off leaves LS_COLORS alone"
option man_pager bat "Page man pages through bat (bat or batcat) when installed; off keeps the pager module's less colours"
option bat_theme "" "BAT_THEME for bat, delta and the previews; empty keeps bat's default"
option delta off "Use delta as git's pager through an include of this module's delta.gitconfig"
option fzf on "fzf defaults: file listing with fd or rg, layout, and bat and eza previews (also for fzf-tab)"
package brew vivid
package brew bat
package brew git-delta
package brew fzf
package brew fd
