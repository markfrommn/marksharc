# MarkSharc overlay configuration.
#
# This file belongs to you; the framework never edits it, and `marksharc module
# enable|disable` only changes the `module` lines below.
#
# Modules
# -------
# With no active `module <name>` line, every public module in the framework is
# enabled. Switch one off by removing the leading `# ` from its line:
#
#     module brew off
#
# Do not add a plain `module <name>` line unless you want an explicit list: as soon
# as one exists, only the modules you name load. `marksharc module list` shows
# the state of every module.
#
# module agent off
# module brew off
# module bun off
# module cc-providers off
# module cloud off
# module command-not-found off
# module completion off
# module completion-fzf-tab off
# module cuda off
# module cwf off
# module direnv off
# module docker off
# module editor off
# module fish-bridge off
# module fzf-fish off
# module git-worktree off
# module go off
# module go-gvm off
# module greeting off
# module herdr off
# module history-atuin off
# module history-native off
# module lmstudio off
# module ls off
# module mise off
# module mux off
# module nav off
# module node-nvm off
# module pager off
# module path off
# module pnpm off
# module prompt-starship off
# module ps off
# module python off
# module rust off
# module ssh-agent off
# module titles off
# module wezterm off
# module x11 off
# module zoxide off
# module zsh-options off

# Options
# -------
# `set <module>.<key> <value>` sets a module option. Each module declares its
# options in its module.conf; these are examples, none is active.
#
# set core.dot_in_path on
# set agent.markers MY_AGENT_VARIABLE
# set editor.command "emacs -nw"
# set path.tiers "manager brew system user app local"
# set greeting.fortune on
# set mise.tools "node go python ruby"
# set mise.hook chpwd

# Declarative environment
# -----------------------
# env, path and alias values are shell words: quote spaces, use ~ or $NAME for
# references. Optional `when command|dir|file|os|host ...` guards are available.
# A tiers line replaces the middle of the default tier order; first/last stay fixed.
#
# path user ~/bin
# env EDITOR "emacs -nw"
# alias ll "ls -lA"
# tiers "manager brew system user app local"
