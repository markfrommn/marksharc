# MarkSharc host inventory for `marksharc push`.
#
# One host per line using the line-directive format:
#   host <name> [<ssh-target>]
#
# When <ssh-target> is omitted, <name> is passed directly to ssh.
# Use `marksharc hosts populate` to pick hosts from ~/.ssh/config and `hc machine ls`.
#
# Examples:
# host workstation
# host server-a admin@server-a.example.com
